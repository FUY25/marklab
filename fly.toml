app = "marklab-relay-alpha"
primary_region = "sin"

[build]
  dockerfile = "infra/docker/api.Dockerfile"

[env]
  PORT = "3001"
  MARKLAB_REQUIRE_AUTH = "true"
  MARKLAB_PUBLIC_WEB_URL = "https://marklab-relay-alpha.fly.dev"
  MARKLAB_PUBLIC_API_URL = "https://marklab-relay-alpha.fly.dev"
  MARKLAB_ALLOWED_ORIGINS = "https://marklab-relay-alpha.fly.dev"
  # Alpha co-locates the control-plane API and an API-supervised upstream
  # Y-Sweet child process. MARKLAB_YSWEET_AUTH and
  # MARKLAB_YSWEET_SERVER_TOKEN are generated by `y-sweet gen-auth --json`
  # and must be set as Fly secrets, not checked into this file.
  MARKLAB_YSWEET_PROVIDER_MODE = "process"
  MARKLAB_YSWEET_SERVER_URL = "http://127.0.0.1:8080"
  MARKLAB_YSWEET_PUBLIC_URL_PREFIX = "https://marklab-relay-alpha.fly.dev"
  MARKLAB_YSWEET_STORE_PATH = "/data/ysweet"
  MARKLAB_YSWEET_HOST = "127.0.0.1"
  MARKLAB_YSWEET_PORT = "8080"
  MARKLAB_YSWEET_CHECKPOINT_FREQ_SECONDS = "10"
  MARKLAB_YSWEET_SKIP_GC = "false"

[[mounts]]
  source = "marklab_ysweet_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  # The API-supervised Y-Sweet provider stores checkpoint state on the mounted
  # volume. Keep at least one machine running for the alpha pilot.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
