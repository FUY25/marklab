name: CI

on:
  push:
    branches:
      - main
      - macos-app
  pull_request:

jobs:
  node:
    name: Node typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  postgres-revoke:
    name: Real Postgres revoke regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: marklab_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/marklab_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Revoke regression
        run: pnpm --filter @marklab/api exec vitest run src/services/runtime-access-revocation-service.real.test.ts

  generated-bundle:
    name: Generated bundle drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Rebuild local editor bundle
        run: pnpm --dir apps/marklab-macos build:local-editor

      - name: Verify generated bundle is committed
        run: git diff --exit-code -- apps/marklab-macos/Sources/MarkLabApp/Resources/MarkEditLocalEditor/local-editor.js

  macos-swift:
    name: Swift tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift test
        run: swift test --package-path apps/marklab-macos
